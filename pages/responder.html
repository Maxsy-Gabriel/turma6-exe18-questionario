<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Cadastro de Questionários</title>
  <link rel="stylesheet" href="/style/style.css">
</head>
<body>

  <header class="topbar">
    <h1>Questionários</h1>
    <nav class="tabs">
      <a class="tab-btn" href="/pages/perguntas.html">Perguntas</a>
      <a class="tab-btn" href="/pages/formularios.html">Formulários</a>
      <a class="tab-btn active" href="/pages/responder.html">Responder</a>
      <a class="tab-btn" href="/pages/respostas.html">Respostas</a>
    </nav>
  </header>

  <main>

    <!-- ===================== PÁGINA: RESPONDER (pública) ===================== -->
    <section id="page-responder" class="page active">
      <h2>Responder formulário</h2>

      <div class="card">
        <label for="select-formulario-responder">Selecione o formulário</label>
        <select id="select-formulario-responder">
        </select>
      </div>

      <form id="form-responder" class="card form-card">

        <div class="formulario-cabecalho">
          <h3 id="responder-titulo">Pesquisa de satisfação</h3>
          <p id="responder-descricao">Avalie sua experiência com o nosso curso.</p>
        </div>

        <label for="respondente-nome">Nome</label>
        <input type="text" id="respondente-nome" placeholder="Seu nome" required>

        <label for="respondente-email">E-mail</label>
        <input type="email" id="respondente-email" placeholder="seu@email.com" required>

        <div id="perguntas-responder" class="perguntas-responder">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Enviar resposta</button>
        </div>
        <p id="responder-erro" class="mensagem-erro"></p>
        <p id="responder-sucesso" class="mensagem-sucesso"></p>
      </form>
    </section>

  </main>

  <script src="/js/responder.js"></script>
</body>
</html>
